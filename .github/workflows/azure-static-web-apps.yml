# Azure Static Web Apps CI/CD workflow.
#
# IMPORTANT: exact folder values below must be confirmed when you create the
# SWA resource in the Azure portal (it will "auto-generate" a workflow based on
# how you configure it). The values here are the standard ones for a Next.js
# frontend plus a serverless `/api` Azure Functions backend. Validate the
# generated workflow against this file before your first deploy.
#
# Required GitHub secrets (set in the repo settings → Secrets → Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  (auto-created by Azure when you link the repo)
# The api_token is the ONLY secret this workflow needs; all other secrets
# (SENDGRID_API_KEY, AZURE_TABLES_CONNECTION_STRING, etc.) are set as
# app-settings on the SWA resource, NOT in the repo.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Application source location.
          app_location: "/"
          # API source location (Azure Functions). The api is TypeScript and
          # compiles to dist/ (gitignored), so build it during deployment.
          api_location: "api"
          api_build_command: "npm run build"
          # Next.js (non-static-export) has no separate output folder; leave empty.
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
